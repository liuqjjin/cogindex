version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # CocoIndex and Cognee are audited against pinned upstream commits, so their
  # upgrades remain manual. Dependabot can still refresh every other resolved
  # dependency without changing the supported-version floors in pyproject.toml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      resolved-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: cocoindex
      - dependency-name: cognee

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
