name: Upstream compatibility (nightly)

# Detects breaking changes in cocoindex/cognee ahead of user reports:
# installs the newest released upstreams (ignoring our lockfile) and runs the
# unit suite (which includes the compatibility-surface tests) plus the
# deterministic integration tier, where behavior changes that signatures
# cannot reveal actually surface.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  newest-upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      # Deliberately override the supported Cognee range here. The regular CI
      # remains on the audited safe release; nightly tells us when a newer
      # upstream is compatible and can be admitted again.
      - run: uv pip install --upgrade cocoindex cognee
      - run: uv pip list | grep -Ei 'cocoindex|cognee'
      - run: uv run pytest tests/unit -q
      - run: uv run pytest tests/integration -q -m integration
