name: Release

# Tag-driven. `git tag v0.1.0 && git push --tags` builds, verifies the tag
# matches the version in the package, publishes to PyPI through Trusted
# Publishing, and opens a GitHub release.
#
# Trusted Publishing means no API token lives in this repository: PyPI accepts
# a short-lived OIDC identity scoped to this workflow file and this
# environment. It has to be registered on PyPI before the first release, and
# for a project that does not exist there yet that happens under
# https://pypi.org/manage/account/publishing/ as a "pending publisher"; the
# per-project settings page only appears once a release has landed. The claims
# must match exactly: owner liuqjjin, repository cogindex, workflow
# release.yml, environment pypi. A mismatch fails with `invalid-publisher`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          packaged="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$packaged" ]; then
            echo "tag v$tag does not match pyproject version $packaged" >&2
            exit 1
          fi

      - run: uv build
      - name: Built wheel and source archive install cleanly
        run: scripts/smoke_install.sh dist/cogindex-*.whl dist/cogindex-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create release from the CHANGELOG section for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "v$version" dist/* --title "v$version" --notes-file notes.md
