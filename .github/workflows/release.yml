name: Release

# Tag-driven. `git tag v0.1.0 && git push --tags` builds, verifies the tag
# matches the version in the package, publishes to PyPI through Trusted
# Publishing, and opens a GitHub release.
#
# Trusted Publishing means no API token lives in this repository: PyPI is
# configured to accept an OIDC identity scoped to this workflow file. Setup is
# at https://pypi.org/manage/project/cogindex/settings/publishing/.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          packaged="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$packaged" ]; then
            echo "tag v$tag does not match pyproject version $packaged" >&2
            exit 1
          fi

      - run: uv build
      - name: Wheel installs and imports in a clean environment
        run: scripts/smoke_install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release from the CHANGELOG section for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "v$version" dist/* --title "v$version" --notes-file notes.md
